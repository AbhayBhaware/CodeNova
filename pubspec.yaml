name: codenova_app
description: "CodeNova Tech Solutions Mobile Application - IT Training & Internship Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts - for premium typography (Poppins)
  google_fonts: ^6.2.1

  # Navigation - declarative routing with deep-link support
  go_router: ^14.8.1

  # URL Launcher - for phone, email, and web links
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets – add actual image files under assets/images/
  assets:
    - assets/images/
